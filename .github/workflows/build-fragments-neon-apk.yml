name: Build Fragments Neon APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/fragments-neon/**"
      - ".github/workflows/build-fragments-neon-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release APK
        working-directory: artifacts/fragments-neon/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fragments-neon-apk-${{ github.run_number }}
          path: artifacts/fragments-neon/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14